[package]
name        = "gameinfo"
version     = "0.2.0"
edition     = "2024"
rust-version = "1.85"
description = "Unified game metadata from IGDB, TheGamesDB and Steam with smart multi-provider matching"
license     = "MIT"
readme      = "README.md"
repository  = "https://github.com/OxidShell/gameinfo"
keywords    = ["game-metadata", "igdb", "steam", "game-database", "gaming"]
categories  = ["api-bindings", "asynchronous", "caching", "web-programming::http-client"]
exclude     = [".gitignore"]

[features]
default = []
steam   = []
cache   = []

[dependencies]
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1",    features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
async-trait = "0.1"
tracing     = "0.1"
strsim      = "0.11"
time        = { version = "0.3",  features = ["serde", "parsing", "formatting", "macros"] }

[dev-dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
