[package]
name = "gameinfo"
version = "0.1.0"
edition = "2024"
description = "Unified game metadata from IGDB, TheGamesDB and Steam with smart multi-provider matching"
license = "MIT"

[features]
default = []
steam = []
cache = []

[dependencies]
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
] }
async-trait = "0.1"
tracing = "0.1"
strsim = "0.11"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
